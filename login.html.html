<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student Login - PG Education">
    <meta name="theme-color" content="#1e3a8a">
    <title>Student Login | PG Education</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 80px;
        }
        .login-card {
            max-width: 450px;
            margin: 0 auto;
            width: 100%;
        }
    </style>
</head>
<body class="light-mode">

    <!-- Animated Background Elements -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg fixed-top glass-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold text-gradient" href="index.html">
                <i class="fa-solid fa-graduation-cap me-2 text-orange"></i>PG Education
            </a>
            <button class="navbar-toggler shadow-none border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="fa-solid fa-bars text-primary-theme"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <button id="theme-toggle" class="btn btn-icon glass-btn"><i class="fa-solid fa-moon"></i></button>
                    <a href="register.html" class="btn btn-primary-gradient rounded-pill px-4">Register</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="login-section">
        <div class="container">
            <div class="glass-card login-card p-4 p-md-5 rounded-4 shadow-lg position-relative overflow-hidden">
                
                <div class="text-center mb-4">
                    <div class="icon-box bg-primary-subtle text-primary rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 70px; height: 70px;">
                        <i class="fa-solid fa-user-graduate fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-primary-theme">Welcome Back</h3>
                    <p class="text-muted-theme small">Login to access your Student Dashboard</p>
                </div>

                <form id="loginForm">
                    <!-- Mobile Number -->
                    <div class="mb-4">
                        <label class="form-label fw-medium text-primary-theme small">Mobile Number</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                            <input type="tel" id="loginMobile" class="form-control" placeholder="Enter Registered Mobile" pattern="[0-9]{10}" maxlength="10" required autocomplete="off">
                        </div>
                    </div>
                    
                    <!-- Password -->
                    <div class="mb-4">
                        <label class="form-label fw-medium text-primary-theme small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="loginPassword" class="form-control" placeholder="Enter Password" required>
                            <button class="btn btn-outline-secondary border-start-0 border" type="button" id="togglePassword" style="background: var(--input-bg); border-color: var(--glass-border) !important;">
                                <i class="fa-solid fa-eye text-muted-theme"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label text-muted-theme small" for="rememberMe">Remember me</label>
                        </div>
                        <a href="#" class="text-orange small text-decoration-none fw-semibold">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary-gradient w-100 py-2 rounded-pill fw-bold mb-3" id="loginBtn">
                        Login <i class="fa-solid fa-right-to-bracket ms-2"></i>
                    </button>
                    
                    <div class="text-center">
                        <p class="text-muted-theme small mb-0">Don't have an account? <a href="register.html" class="text-orange fw-semibold text-decoration-none">Register Now</a></p>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Firebase SDK & Custom Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
