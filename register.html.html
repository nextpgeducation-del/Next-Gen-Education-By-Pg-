<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register at PG Education - Premium coaching for classes 6 to 12.">
    <meta name="theme-color" content="#1e3a8a">
    <title>Student Registration | PG Education</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .register-section {
            padding-top: 100px;
            padding-bottom: 50px;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .register-card {
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="light-mode">

    <!-- Animated Background Elements -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg fixed-top glass-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold text-gradient" href="index.html">
                <i class="fa-solid fa-graduation-cap me-2 text-orange"></i>PG Education
            </a>
            <button class="navbar-toggler shadow-none border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="fa-solid fa-bars text-primary-theme"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <button id="theme-toggle" class="btn btn-icon glass-btn"><i class="fa-solid fa-moon"></i></button>
                    <a href="login.html" class="btn btn-outline-orange glass-btn rounded-pill px-4">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Registration Section -->
    <section class="register-section">
        <div class="container">
            <div class="glass-card register-card p-4 p-md-5 rounded-4 shadow-lg">
                <div class="text-center mb-5">
                    <span class="badge bg-orange-subtle text-orange rounded-pill px-3 py-2 mb-2">New Admission</span>
                    <h2 class="fw-bold text-primary-theme">Student Registration</h2>
                    <p class="text-muted-theme">Join PG Education. Fill in your details to create an account.</p>
                </div>

                <form id="registerForm">
                    <div class="row g-4">
                        <!-- Student Name -->
                        <div class="col-md-6">
                            <label class="form-label fw-medium text-primary-theme small">Student Name <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                <input type="text" id="regName" class="form-control" placeholder="Enter Full Name" required>
                            </div>
                        </div>

                        <!-- Father's Name -->
                        <div class="col-md-6">
                            <label class="form-label fw-medium text-primary-theme small">Father's Name <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-user-tie"></i></span>
                                <input type="text" id="regFatherName" class="form-control" placeholder="Enter Father's Name" required>
                            </div>
                        </div>

                        <!-- Mobile Number -->
                        <div class="col-md-6">
                            <label class="form-label fw-medium text-primary-theme small">Mobile Number <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                                <input type="tel" id="regMobile" class="form-control" placeholder="10-digit Mobile Number" pattern="[0-9]{10}" maxlength="10" required>
                            </div>
                            <div class="form-text text-muted-theme small">This will be your login ID.</div>
                        </div>

                        <!-- Email (Optional) -->
                        <div class="col-md-6">
                            <label class="form-label fw-medium text-primary-theme small">Email Address (Optional)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                <input type="email" id="regEmail" class="form-control" placeholder="example@email.com">
                            </div>
                        </div>

                        <!-- School Name -->
                        <div class="col-md-12">
                            <label class="form-label fw-medium text-primary-theme small">School Name <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-school"></i></span>
                                <input type="text" id="regSchool" class="form-control" placeholder="Enter Current School Name" required>
                            </div>
                        </div>

                        <!-- Class -->
                        <div class="col-md-6">
                            <label class="form-label fw-medium text-primary-theme small">Class <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-book-open"></i></span>
                                <select id="regClass" class="form-select" required>
                                    <option value="" disabled selected>Select Class</option>
                                    <option value="6">Class 6</option>
                                    <option value="7">Class 7</option>
                                    <option value="8">Class 8</option>
                                    <option value="9">Class 9</option>
                                    <option value="10">Class 10</option>
                                    <option value="11">Class 11 (Science)</option>
                                    <option value="12">Class 12 (Science)</option>
                                </select>
                            </div>
                        </div>

                        <!-- PIN Code -->
                        <div class="col-md-6">
                            <label class="form-label fw-medium text-primary-theme small">PIN Code <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-map-pin"></i></span>
                                <input type="text" id="regPin" class="form-control" placeholder="6-digit PIN Code" pattern="[0-9]{6}" maxlength="6" required>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="col-md-6">
                            <label class="form-label fw-medium text-primary-theme small">Create Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" id="regPassword" class="form-control" placeholder="Min. 6 characters" minlength="6" required>
                            </div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="col-md-6">
                            <label class="form-label fw-medium text-primary-theme small">Confirm Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" id="regConfirmPassword" class="form-control" placeholder="Re-enter Password" minlength="6" required>
                            </div>
                        </div>
                    </div>

                    <div class="mt-5 text-center">
                        <button type="submit" class="btn btn-primary-gradient rounded-pill px-5 py-2 fw-bold w-100 mb-3" id="registerBtn">
                            Submit Registration <i class="fa-solid fa-arrow-right ms-2"></i>
                        </button>
                        <p class="text-muted-theme mb-0">Already have an account? <a href="login.html" class="text-orange fw-semibold">Login here</a></p>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Firebase SDK & Custom Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
